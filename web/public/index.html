<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GOD — Gambit of Deccan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">

<!--
  GOD — Gambit of Deccan.
  Art direction: Deccani manuscript — lapis and indigo grounds, gold leaf rules, ochre and
  vermilion accents, jali-screen ornament, inscriptional caps. Painted, not glossy.
  Feel: rich. Pieces settle with weight, the reveal is staged, kills slash, totals count up,
  points flare. Synthesised audio, no assets.
  Rule taken from the Balatro-likes: everything needed for a decision stays on screen. No
  hovering to find a number.
  Information architecture is unchanged and deliberate — reads left, ground centre, log right.
-->

<style>
  :root{
    --night:#0C1330; --lapis:#16234C; --lapis2:#1D2C5E; --panel:#1A2750;
    --gold:#C9A227; --gold-hi:#E7C55E; --gold-dim:#8A6F22;
    --ivory:#EFE6CF; --ivory-dim:#B9AE93; --ochre:#C8763C;
    --verm:#B03A2C; --jade:#4E8062;
    --ink:#080C1E;
    --f-disp:"Cinzel",Georgia,serif;
    --f-body:"EB Garamond",Georgia,serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;color:var(--ivory);font-family:var(--f-body);font-size:15px;line-height:1.45;
    height:100svh;display:flex;flex-direction:column;overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% -10%, #24356E 0%, var(--lapis) 45%, var(--night) 100%);
  }
  /* jali screen — a real geometric lattice, used sparingly as ornament */
  .jali{
    background-image:
      linear-gradient(45deg,rgba(201,162,39,.13) 25%,transparent 25%,transparent 75%,rgba(201,162,39,.13) 75%),
      linear-gradient(45deg,rgba(201,162,39,.13) 25%,transparent 25%,transparent 75%,rgba(201,162,39,.13) 75%);
    background-size:12px 12px;background-position:0 0,6px 6px;
  }
  .rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim) 15%,var(--gold) 50%,var(--gold-dim) 85%,transparent);opacity:.8}

  .cap{font-family:var(--f-disp);letter-spacing:.18em;text-transform:uppercase;font-size:10px;
    color:var(--gold);opacity:.85}
  .num{font-variant-numeric:tabular-nums lining-nums}

  header{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:10px 14px;border-bottom:1px solid rgba(201,162,39,.28);background:rgba(8,12,30,.5)}
  header .brand{font-family:var(--f-disp);font-weight:700;letter-spacing:.22em;font-size:13px;
    color:var(--gold-hi)}
  header .st{font-family:var(--f-disp);letter-spacing:.14em;font-size:10px;text-transform:uppercase;
    color:var(--ivory-dim)}
  header .st.you{color:var(--gold-hi)}
  #snd{background:none;border:0;color:var(--gold);font-size:15px;cursor:pointer;padding:4px 6px;min-height:0}

  #shell{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  #main{flex:1 1 auto;min-height:0;overflow:auto;padding:12px 14px;display:flex;
    flex-direction:column;gap:10px}
  #side,#right{display:none}
  #handband{flex:0 0 auto;padding:8px 0 8px 14px;border-top:1px solid rgba(201,162,39,.22);
    background:rgba(8,12,30,.42)}
  #bar{flex:0 0 auto;display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(201,162,39,.28);background:rgba(8,12,30,.62)}
  #bar>*{flex:1}

  /* ---- gilt controls ------------------------------------------------- */
  button{
    font-family:var(--f-disp);font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    font-size:11px;color:var(--ivory);min-height:50px;padding:0 12px;cursor:pointer;
    background:linear-gradient(180deg,var(--lapis2),var(--lapis));
    border:1px solid rgba(201,162,39,.4);border-radius:2px;position:relative;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 0 rgba(0,0,0,.45);
    transition:transform .08s ease,box-shadow .08s ease,border-color .15s ease
  }
  button:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 0 0 rgba(0,0,0,.4)}
  button:disabled{color:#5C6484;border-color:rgba(201,162,39,.12);box-shadow:none;cursor:default;
    background:rgba(12,19,48,.6)}
  button.go:not(:disabled){color:var(--ink);border-color:var(--gold-hi);
    background:linear-gradient(180deg,var(--gold-hi),var(--gold));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 #6E5717}
  button.no:not(:disabled){color:#F3DCD6;border-color:rgba(176,58,44,.75);
    background:linear-gradient(180deg,#8E3025,#6E2419);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 0 #4A170F}
  button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
  input{font-family:var(--f-body);font-size:16px;color:var(--ivory);background:rgba(8,12,30,.55);
    border:1px solid rgba(201,162,39,.35);border-radius:2px;padding:0 12px;min-height:50px;width:100%}
  input::placeholder{color:#6B7396}

  /* ---- panels: painted, gilt-framed ---------------------------------- */
  .panel{background:linear-gradient(180deg,rgba(29,44,94,.82),rgba(14,21,48,.82));
    border:1px solid rgba(201,162,39,.3);border-radius:2px;
    box-shadow:inset 0 0 0 1px rgba(8,12,30,.7),0 6px 18px rgba(0,0,0,.45)}

  /* ---- the read ------------------------------------------------------- */
  .who{display:grid;grid-template-columns:4px 1fr auto;gap:9px;align-items:center;
    padding:7px 10px;margin-bottom:7px}
  .who.act{border-color:var(--gold-hi);box-shadow:inset 0 0 0 1px rgba(231,197,94,.3),0 0 14px rgba(201,162,39,.18)}
  .who.out{opacity:.5}
  .who .hue{grid-row:1/3;align-self:stretch;background:var(--h);border-radius:1px}
  .who .nm{font-size:14px;font-weight:600}
  .who .rl{font-family:var(--f-disp);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ivory-dim)}
  .who .vp{font-family:var(--f-disp);font-size:20px;font-weight:700;color:var(--gold-hi)}
  .who .stats{grid-column:2/4;display:flex;flex-wrap:wrap;gap:9px;font-size:12px;color:var(--ivory-dim)}
  .who .stats b{color:var(--ivory);font-weight:600}
  .who .stats .hot{color:var(--ochre)}

  /* ---- the ground ----------------------------------------------------- */
  .armywrap{padding:9px 10px 11px}
  .armyhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
  .armyhead .ttl{font-family:var(--f-disp);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
  .armyhead .mem{font-size:12px;color:var(--ivory-dim)}
  .armyhead .tot{font-family:var(--f-disp);font-size:24px;font-weight:700;line-height:1}
  .armyhead .tot.win{color:var(--gold-hi);text-shadow:0 0 16px rgba(231,197,94,.55)}
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .slot{aspect-ratio:5/7;position:relative;border-radius:2px;display:flex;align-items:center;
    justify-content:center;overflow:visible;
    background:radial-gradient(90% 70% at 50% 30%,#22346D,#0F1938);
    border:1px solid rgba(201,162,39,.34);
    box-shadow:inset 0 0 22px rgba(8,12,30,.9),0 3px 10px rgba(0,0,0,.5)}
  .slot.empty{background:rgba(8,12,30,.35);border-style:dashed;border-color:rgba(201,162,39,.16)}
  .slot.mine{border-color:var(--gold-hi);box-shadow:inset 0 0 22px rgba(8,12,30,.85),0 0 14px rgba(201,162,39,.25)}
  .slot.hid{background:
      repeating-linear-gradient(45deg,rgba(201,162,39,.07) 0 5px,transparent 5px 10px),
      radial-gradient(90% 70% at 50% 30%,#1A2750,#0C1330)}
  .slot.dead{border-color:var(--verm)}
  .slot .hue{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--h);border-radius:1px 0 0 1px}
  .slot .init{position:absolute;bottom:4px;right:6px;font-family:var(--f-disp);font-size:9px;
    letter-spacing:.1em;color:var(--ivory-dim)}
  /* the numeral overhangs the frame — it is the first thing read */
  .slot .s{position:absolute;top:-11px;left:-8px;min-width:30px;height:30px;padding:0 4px;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    font-family:var(--f-disp);font-weight:700;font-size:16px;color:var(--ink);
    background:radial-gradient(70% 70% at 35% 30%,var(--gold-hi),var(--gold));
    border:1px solid #6E5717;box-shadow:0 2px 6px rgba(0,0,0,.6)}
  .slot.dead .s{background:radial-gradient(70% 70% at 35% 30%,#C4685A,var(--verm));color:#2A0B06}
  .slot .brk{position:absolute;top:5px;right:6px;width:9px;height:9px;transform:rotate(45deg);
    border:1px solid var(--gold-hi);background:rgba(231,197,94,.18)}
  .slot .x{position:absolute;inset:0;pointer-events:none}
  .slot .x line{stroke:var(--verm);stroke-width:3;stroke-linecap:round;
    filter:drop-shadow(0 0 4px rgba(176,58,44,.8))}
  .pcsvg{fill:var(--ivory);filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
  .slot.hid .lbl-fd{font-family:var(--f-disp);font-size:9px;letter-spacing:.14em;color:var(--ivory-dim)}

  .clash{display:flex;align-items:center;justify-content:center;gap:16px;padding:2px 0}
  .node{fill:rgba(8,12,30,.7);stroke:rgba(201,162,39,.45)}
  .node.me{stroke:var(--gold-hi);fill:rgba(201,162,39,.22)}
  .node.kil{stroke:var(--verm);fill:rgba(176,58,44,.2)}
  .node.thr{stroke:var(--ochre);stroke-dasharray:2.5 2.5}
  .nlbl{fill:var(--ivory-dim);font-family:var(--f-disp);font-size:8.5px;text-anchor:middle}
  .nlbl.on{fill:var(--gold-hi)}
  .edge{stroke:rgba(201,162,39,.3);fill:none}
  .ringnote{font-size:13px;color:var(--ivory-dim);line-height:1.5}
  .ringnote b{color:var(--ivory);font-weight:600}
  .ringnote .k{color:var(--verm)} .ringnote .t{color:var(--ochre)}

  /* ---- log ------------------------------------------------------------ */
  .log{display:flex;flex-direction:column-reverse;gap:4px;overflow:auto;font-size:13px;
    padding:9px 11px;min-height:0}
  .log div{color:var(--ivory-dim);line-height:1.4;animation:slidein .28s ease}
  .log .kill{color:#D98274} .log .ground{color:var(--ivory);font-weight:600}
  .log .score{color:var(--gold-hi)} .log .recruit{color:#82B394}
  .log .rockets{color:var(--verm);font-weight:600;letter-spacing:.04em}
  .log .offer,.log .accept,.log .refuse{color:#9FB4D8}
  @keyframes slidein{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

  /* ---- hand ----------------------------------------------------------- */
  .hand{display:flex;gap:9px;overflow-x:auto;padding:6px 14px 6px 0;scroll-snap-type:x proximity;
    touch-action:pan-x;overscroll-behavior-x:contain;scrollbar-width:none}
  .hand::-webkit-scrollbar{display:none}
  .pc{flex:0 0 68px;min-height:100px;scroll-snap-align:start;position:relative;border-radius:2px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    padding:10px 3px 5px;cursor:pointer;
    background:radial-gradient(90% 70% at 50% 25%,#22346D,#0F1938);
    border:1px solid rgba(201,162,39,.34);
    box-shadow:inset 0 0 16px rgba(8,12,30,.85),0 3px 8px rgba(0,0,0,.5);
    transition:transform .14s cubic-bezier(.2,1.4,.4,1),box-shadow .14s ease,border-color .14s ease}
  .pc:active{transform:translateY(-2px)}
  .pc.sel{transform:translateY(-10px);border-color:var(--gold-hi);
    box-shadow:inset 0 0 16px rgba(8,12,30,.7),0 0 20px rgba(201,162,39,.45),0 8px 14px rgba(0,0,0,.55)}
  .pc.rest{opacity:.55;cursor:default}
  .pc.rest:active,.pc.burn:active{transform:none}
  .pc.burn{opacity:.35;cursor:default;filter:grayscale(.7)}
  .pc .s{position:absolute;top:-10px;left:-7px;min-width:27px;height:27px;padding:0 4px;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    font-family:var(--f-disp);font-weight:700;font-size:14px;color:var(--ink);
    background:radial-gradient(70% 70% at 35% 30%,var(--gold-hi),var(--gold));
    border:1px solid #6E5717;box-shadow:0 2px 5px rgba(0,0,0,.6)}
  .pc .nmm{font-family:var(--f-disp);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ivory-dim);text-align:center;line-height:1.25}
  .pc .rst{font-size:11px;color:var(--ochre);text-align:center;line-height:1.2}
  .pc .brk{position:absolute;top:5px;right:6px;width:9px;height:9px;transform:rotate(45deg);
    border:1px solid var(--gold-hi);background:rgba(231,197,94,.18)}

  /* ---- flourishes ----------------------------------------------------- */
  @keyframes land{0%{transform:scale(.7) translateY(-16px);opacity:0}
    60%{transform:scale(1.06) translateY(0);opacity:1}100%{transform:none;opacity:1}}
  .land{animation:land .42s cubic-bezier(.2,1.5,.4,1)}
  /* shake scales with what died — magnitude read before any number, as Balatro does */
  @keyframes shake{0%,100%{transform:none}
    20%{transform:translateX(calc(-4px * var(--mag,1)))}
    40%{transform:translateX(calc(4px * var(--mag,1)))}
    60%{transform:translateX(calc(-2px * var(--mag,1)))}
    80%{transform:translateX(calc(2px * var(--mag,1)))}}
  .shake{animation:shake .34s ease}
  /* the unit doing the killing flares gold, so cause and effect are both visible */
  @keyframes strike{0%{box-shadow:inset 0 0 22px rgba(8,12,30,.9),0 3px 10px rgba(0,0,0,.5)}
    45%{box-shadow:inset 0 0 22px rgba(8,12,30,.6),0 0 26px rgba(231,197,94,.85)}
    100%{box-shadow:inset 0 0 22px rgba(8,12,30,.9),0 3px 10px rgba(0,0,0,.5)}}
  .strike{animation:strike .34s ease}
  .callout{font-family:var(--f-disp);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:#E0A090;text-align:center;min-height:18px;animation:slidein .2s ease}
  @keyframes slash{from{stroke-dashoffset:180}to{stroke-dashoffset:0}}
  .slot .x line{stroke-dasharray:180;animation:slash .3s ease forwards}
  @keyframes flare{0%{opacity:0;transform:scale(.6)}30%{opacity:1;transform:scale(1.15)}
    100%{opacity:0;transform:scale(1.5)}}
  .flare{position:fixed;inset:0;pointer-events:none;z-index:20;display:flex;align-items:center;
    justify-content:center}
  .flare span{font-family:var(--f-disp);font-weight:700;font-size:12vw;color:var(--gold-hi);
    text-shadow:0 0 40px rgba(231,197,94,.8);animation:flare 1.1s ease forwards}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .pc.sel{transform:none}
  }


  /* ---- commitment preview & declarations ------------------------------ */
  .preview{margin-top:7px;font-size:12px;color:var(--gold-hi);font-style:italic;line-height:1.35}
  .preview.dim2{color:#6B7396;font-style:normal}
  .mem .cmine{color:var(--gold-hi)}
  .claimlab{position:absolute;top:6px;left:8px;font-family:var(--f-disp);font-size:8px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ochre);max-width:70%}
  .decl{padding:8px 14px;border-top:1px solid rgba(201,162,39,.18);display:flex;gap:6px;
    overflow-x:auto;align-items:center;scrollbar-width:none;background:rgba(8,12,30,.35)}
  .decl::-webkit-scrollbar{display:none}
  .decl .cap{flex:0 0 auto;padding-right:4px}
  .decl button{min-height:40px;font-size:10px;padding:0 9px;flex:0 0 auto}
  .decl button.on{border-color:var(--ochre);color:var(--ochre)}
  /* ---- foyer ----------------------------------------------------------- */
  .foyer{display:flex;gap:14px;justify-content:center;font-size:13px;color:var(--ivory-dim);
    padding:2px 0 6px}
  .foyer b{color:var(--gold-hi);font-weight:600}
  .tables{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
  .tables button{min-height:40px;font-size:10px;padding:0 10px;flex:0 0 auto}
  /* ---- onboarding ------------------------------------------------------ */
  .ob{position:fixed;inset:0;z-index:30;background:rgba(6,9,22,.94);display:flex;
    flex-direction:column;padding:18px 16px calc(18px + env(safe-area-inset-bottom));overflow:auto}
  .ob h2{font-family:var(--f-disp);color:var(--gold-hi);font-size:20px;margin:0 0 2px;letter-spacing:.06em}
  .ob ul{margin:10px 0 0;padding-left:18px}
  .ob li{margin-bottom:7px;color:var(--ivory)}
  .ob .dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
  .ob .dot{width:7px;height:7px;border-radius:50%;background:#3A4570}
  .ob .dot.on{background:var(--gold-hi)}
  .obcards{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
  .obc{width:74px;border:1px solid rgba(201,162,39,.34);border-radius:2px;padding:8px 3px 5px;
    text-align:center;background:radial-gradient(90% 70% at 50% 25%,#22346D,#0F1938);position:relative}
  .obc .s{position:absolute;top:-9px;left:-6px;width:25px;height:25px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);
    font-weight:700;font-size:13px;color:var(--ink);
    background:radial-gradient(70% 70% at 35% 30%,var(--gold-hi),var(--gold));border:1px solid #6E5717}
  .obc .n{font-family:var(--f-disp);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ivory-dim);margin-top:3px}

  /* ---- sheets / lobby -------------------------------------------------- */
  .sheet{position:fixed;inset:auto 0 0 0;z-index:22;padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,#1D2C5E,#0C1330);border-top:2px solid var(--gold)}
  .sheet h3{font-family:var(--f-disp);margin:0 0 4px;font-size:17px;color:var(--gold-hi);letter-spacing:.06em}
  .sheet p{margin:8px 0 14px;color:var(--ivory-dim);font-size:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .cell{text-align:left;min-height:66px;padding:9px 11px;font-family:var(--f-body);
    text-transform:none;letter-spacing:0;font-size:14px;font-weight:600}
  .cell .era{display:block;font-family:var(--f-body);font-size:12px;font-weight:400;
    font-style:italic;color:var(--ivory-dim);letter-spacing:0;text-transform:none;margin-top:3px}
  .cell.on{color:var(--ink)}
  .cell.on .era{color:rgba(8,12,30,.7)}
  .score{display:grid;grid-template-columns:1fr auto auto;gap:3px 12px;font-size:13px;padding:9px 11px}
  .score .h{font-family:var(--f-disp);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold);opacity:.8}
  .score .me{color:var(--gold-hi);font-weight:600}
  .err{color:#E39C8E;font-size:13px;padding:2px 0}
  .center{text-align:center}
  h1.title{font-family:var(--f-disp);font-weight:700;font-size:clamp(26px,7vw,40px);
    letter-spacing:.1em;margin:6px 0 2px;color:var(--gold-hi);text-align:center}
  .sub{text-align:center;font-style:italic;color:var(--ivory-dim);margin:0 0 14px}

  @media (min-width:960px){
    #shell{display:grid;grid-template-columns:minmax(250px,1fr) minmax(440px,2.1fr) minmax(270px,1fr);
      grid-template-rows:1fr auto auto;min-height:0}
    #side{display:flex;flex-direction:column;gap:8px;padding:12px 14px;overflow:auto;grid-row:1/4;
      border-right:1px solid rgba(201,162,39,.22)}
    #main{grid-column:2;grid-row:1}
    #handband{grid-column:2;grid-row:2}
    #bar{grid-column:2;grid-row:3}
    #right{display:flex;flex-direction:column;gap:8px;padding:12px 14px;overflow:hidden;
      grid-column:3;grid-row:1/4;border-left:1px solid rgba(201,162,39,.22)}
    .log{flex:1 1 auto}
    .slot .s{width:34px;height:34px;font-size:19px}
  }
  @media (max-width:959px){#right.m{display:flex;flex-direction:column;gap:7px;padding:0 14px 10px;max-height:32svh}}
</style>

    <ellipse cx="7" cy="17" rx="4" ry="6"/><ellipse cx="33" cy="17" rx="4" ry="6"/></symbol>
  <symbol id="s-CANNON" viewBox="0 0 40 48">
    <rect x="4" y="37" width="32" height="4" rx="1.5"/>
    <circle cx="11" cy="40" r="6"/><circle cx="29" cy="40" r="6"/>
    <path d="M7 34 L30 14 L35 21 L12 39Z"/><circle cx="32" cy="17" r="4"/></symbol>
  <symbol id="s-HORSEMAN" viewBox="0 0 40 48">
    <path d="M11 46V33Q9 22 17 17L15 10Q14 5 20 5Q25 5 26 10L31 15Q37 19 35 27L32 33V46Z"/>
    <path d="M18 7 L16 1 L22 4Z"/><circle cx="20" cy="13" r="1.6" fill="#0C1330"/></symbol>
  <symbol id="s-RIFLEMAN" viewBox="0 0 40 48">
    <circle cx="16" cy="12" r="6"/><path d="M10 46V27Q10 21 16 21Q22 21 22 27V46Z"/>
    <rect x="24" y="6" width="3" height="32" rx="1.5" transform="rotate(13 25 22)"/></symbol>
  <symbol id="s-WARRIOR" viewBox="0 0 40 48">
    <circle cx="15" cy="17" r="5.5"/><path d="M9.5 46V31Q9.5 26 15 26Q20.5 26 20.5 31V46Z"/>
    <path d="M24 24Q31 29 31 35Q31 42 24 46Z"/></symbol>
</defs></svg>

<header>
  <span class="brand" id="brand">GOD</span>
  <span style="display:flex;align-items:center;gap:8px">
    <span class="st" id="status">connecting</span>
    <button id="how" title="How to play" style="background:none;border:0;color:var(--gold);font-size:11px;font-family:var(--f-disp);letter-spacing:.12em;cursor:pointer;padding:4px 6px;min-height:0">HOW TO PLAY</button>
    <button id="snd" title="Sound">♪</button>
  </span>
</header>
<div class="jali" style="height:5px;flex:0 0 auto;opacity:.5"></div>
<div id="shell">
  <aside id="side"></aside>
  <main id="main"></main>
  <div id="handband" hidden><div class="cap" style="padding:0 14px 5px" id="handlbl"></div>
    <div class="hand" id="hand"></div></div>
  <div id="bar"></div>
  <aside id="right"></aside>
</div>
<div id="sheet"></div>

<script type="module">
const $=(i)=>document.getElementById(i);
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n};
const RING=["ELEPHANT","RIFLEMAN","CANNON","HORSEMAN","WARRIOR"];
const SHORT={ELEPHANT:"Elephant",RIFLEMAN:"Rifleman",CANNON:"Cannon",HORSEMAN:"Horseman",WARRIOR:"Warrior"};
const HUES=["#6E9BC4","#C0563A","#7FA163","#A98BC4","#C9A227","#C98BA0","#5F9C96","#B58F5B"];
const beats=(x,y)=>y===(x+1)%5||y===(x+2)%5;
const in2=(n)=>(n||"?").replace(/[^A-Za-z0-9]/g,"").slice(0,2).toUpperCase();

let ws,me={id:localStorage.getItem("god.id"),code:localStorage.getItem("god.code"),seat:-1};
let lobby=null,v=null,sel=null,err="",stage=3,timer=null,sheet=null;
let seenLog=0,lastPhase=null;
// reveal staging: how many kills have fired, the rolling totals, the current callout line
let killStep=0,roll=null,callout="",shakeMag=1;
let foyerD=null,ob=null,declRow=null;   // foyer presence, onboarding page index

/* ---- synthesised audio: no assets, one oscillator per hit ------------- */
let AC=null,muted=localStorage.getItem("god.mute")==="1";
const ac=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
function tone(f,d,type="triangle",g=.14,slideTo){
  if(muted)return;try{const c=ac(),o=c.createOscillator(),v2=c.createGain();
    o.type=type;o.frequency.value=f;
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,c.currentTime+d);
    v2.gain.value=g;v2.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);
    o.connect(v2);v2.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch{}
}
const S={
  tap:()=>tone(320,.06,"square",.05),
  land:()=>{tone(150,.16,"sine",.2,90);tone(420,.09,"triangle",.07)},
  kill:()=>{tone(190,.22,"sawtooth",.13,70)},
  reveal:()=>{tone(110,.5,"sine",.22,220)},
  point:()=>{[660,880,1320].forEach((f,i)=>setTimeout(()=>tone(f,.24,"triangle",.11),i*90))},
  refuse:()=>tone(150,.2,"square",.1,110),
  win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.36,"triangle",.13),i*130)),
};
$("snd").onclick=()=>{muted=!muted;localStorage.setItem("god.mute",muted?"1":"0");
  $("snd").textContent=muted?"♪̸":"♪";
$("how").onclick=()=>{S.tap();ob=0;paint()};if(!muted)S.tap()};
$("snd").textContent=muted?"♪̸":"♪";

function connect(){
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
  ws.onopen=()=>{$("status").textContent="online";
    if(me.id&&me.code)send({t:"join",code:me.code,id:me.id});paint()};
  ws.onclose=()=>{$("status").textContent="offline";setTimeout(connect,1500)};
  ws.onmessage=(e)=>{const m=JSON.parse(e.data);
    if(m.t==="seated"){me.seat=m.seat;me.code=m.code;me.id=m.id;
      localStorage.setItem("god.id",m.id);localStorage.setItem("god.code",m.code)}
    if(m.t==="foyer"){foyerD=m;
      if(ob===null&&!localStorage.getItem("god.seen")){ob=0;localStorage.setItem("god.seen","1")}}
    if(m.t==="lobby"){lobby=m;v=null}
    if(m.t==="view"){
      const prev=v;v=m.view;
      if(v.log&&prev){const fresh=v.log.slice(seenLog);
        if(fresh.some(x=>x.kind==="refuse"))S.refuse();
        else if(fresh.some(x=>x.kind==="commit"||x.kind==="accept"))S.land()}
      seenLog=v.log?v.log.length:0;
      if(v.phase==="resolved"&&lastPhase!=="resolved")reveal();
      else if(v.phase!=="resolved")stage=3;
      if(v.phase==="over"&&lastPhase!=="over")setTimeout(S.win,300);
      lastPhase=v.phase;
      if(v.toAct!==me.seat)sel=null;
    }
    if(m.t==="error"){err=m.msg;S.refuse();setTimeout(()=>{err="";paint()},2600)}
    paint()};
}
const send=(m)=>{S.tap();ws&&ws.readyState===1&&ws.send(JSON.stringify(m))};

/* ---- the reveal ------------------------------------------------------------
   Balatro's lesson: show WHY. Each kill activates in sequence with its own callout, its own
   note a step up the scale, and shake scaled to what died — rather than every cross appearing
   at once. Then the totals ROLL rather than appear, because a number that counts up is a number
   the player feels. Tap to skip straight to the end.                                        */
const NOTES=[392,440,494,523,587,659,698,784];
function reveal(){
  clearTimeout(timer);
  const rev=v&&v.reveal;const kills=(rev&&rev.kills)||[];
  stage=0;killStep=0;roll=[0,0];callout="";S.reveal();paint();
  let t=470;
  kills.forEach((k,i)=>{
    timer=setTimeout(()=>{
      stage=1;killStep=i+1;
      callout=`${SHORT[k.by.arm]} ${k.by.s} cancels ${SHORT[k.hit.arm]} ${k.hit.s}`;
      shakeMag=Math.min(3,1+k.hit.s/5);
      tone(NOTES[Math.min(i,NOTES.length-1)],.16,"triangle",.1);
      tone(180-i*8,.2,"sawtooth",.1,70);
      paint();
    },t);t+=340;
  });
  // then roll the totals
  timer=setTimeout(()=>{
    stage=2;callout="";const fin=(rev&&rev.totals)||[0,0];
    const steps=14;let s2=0;
    const tick=()=>{
      s2++;roll=[Math.round(fin[0]*s2/steps)||0,Math.round(fin[1]*s2/steps)||0];
      if(s2%3===0)tone(300+s2*26,.07,"square",.05);
      paint();
      if(s2<steps)timer=setTimeout(tick,42);
      else{
        roll=null;paint();
        if(rev&&rev.awarded&&rev.awarded.length){S.point();
          const mine=rev.awarded.find(([p])=>p===v.you);
          if(mine)flare("+"+mine[1])}
      }
    };tick();
  },t+120);
}
function skipReveal(){
  clearTimeout(timer);stage=2;killStep=999;roll=null;callout="";paint();
}
function flare(txt){
  const f=el("div","flare",`<span>${txt}</span>`);document.body.append(f);
  setTimeout(()=>f.remove(),1200);
}
document.addEventListener("pointerdown",()=>{
  if(v&&v.phase==="resolved"&&(stage<2||roll))skipReveal()});

const svg=(arm,h)=>`<svg class="pcsvg" width="${Math.round(h*.833)}" height="${h}" aria-hidden="true"><use href="#s-${arm}"/></svg>`;


/* ---- onboarding: one line per idea, and the cards it deals you, drawn from the real deck --- */
function obPages(){
  const f=(foyerD&&foyerD.force)||[],b=(foyerD&&foyerD.brokers)||[];
  const ring=(foyerD&&foyerD.ring)||[];
  const chain=ring.map(r=>`${r.arm[0]+r.arm.slice(1).toLowerCase()} ${r.s}`).join(" → ");
  return [
    {h:"Two armies, one ground",ul:[
      "Every round, two armies form on one piece of ground.",
      "You do not command an army — you put units into one.",
      "Up to three units and three players in each.",
      "The higher surviving total takes the ground."]},
    {h:"The ring decides everything",ul:[
      "Each arm cancels the NEXT TWO along the ring:",
      chain+" → back to the start.",
      "So a Warrior 1 cancels an Elephant 9. The cheapest kills the biggest.",
      "A cancelled unit adds nothing — but it still cancels."],ring:true},
    {h:"Your Force",ul:["Eight units. Every ruler holds at least one of every arm.",
      "Strength is printed on the unit and fixed to its arm."],cards:f},
    {h:"You commit blind",ul:[
      "Units go down FACE DOWN. Nobody sees what you sent.",
      "You may DECLARE what it was — and you may be lying.",
      "Send into an army someone else leads and they answer blind: accept, or refuse."]},
    {h:"Losing is how you get stronger",ul:[
      "The ground pays ONE POINT to its largest contributor — most units committed, ties share.",
      "Win and your units come home after a round. Lose and they burn for good.",
      "But every defeated player recruits a Power Broker. Only the defeated ever get one."],cards:b},
  ];
}
function obHTML(){
  const pages=obPages(),i=Math.max(0,Math.min(ob,pages.length-1)),pg=pages[i];
  const cards=(pg.cards||[]).map(c=>`<div class="obc"><span class="s">${c.s}</span>`+
    `<svg class="pcsvg" width="30" height="36"><use href="#s-${c.arm}"/></svg>`+
    `<div class="n">${c.name?c.name.split(" ")[0]:SHORT[c.arm]}</div></div>`).join("");
  return `<div class="ob"><div class="cap">How to play — ${i+1} of ${pages.length}</div>
    <h2>${pg.h}</h2><ul>${pg.ul.map(x=>`<li>${x}</li>`).join("")}</ul>
    ${pg.ring?`<div style="display:flex;justify-content:center;margin-top:12px">${ringSVG(-1)}</div>`:""}
    ${cards?`<div class="obcards">${cards}</div>`:""}
    <div class="dots">${pages.map((_,k)=>`<span class="dot${k===i?" on":""}"></span>`).join("")}</div>
    <div style="display:flex;gap:9px;margin-top:auto">
      ${i>0?`<button style="flex:1" onclick="window.__ob(${i-1})">Back</button>`:""}
      ${i<pages.length-1?`<button class="go" style="flex:2" onclick="window.__ob(${i+1})">Next</button>`
        :`<button class="go" style="flex:2" onclick="window.__ob(null)">Begin</button>`}
      ${i<pages.length-1?`<button style="flex:1" onclick="window.__ob(null)">Skip</button>`:""}
    </div></div>`;
}
window.__ob=(n)=>{S.tap();ob=n;paint()};

function paint(){
  const main=$("main"),bar=$("bar"),side=$("side"),right=$("right");
  main.innerHTML="";bar.innerHTML="";side.innerHTML="";right.innerHTML="";
  $("handband").hidden=true;right.className=v?"m":"";
  if(declRow){declRow.remove();declRow=null}
  $("sheet").innerHTML=(ob!==null&&ob!==undefined)?obHTML():sheet?sheetHTML():"";
  if(err)main.append(el("div","err center",err));
  if(v)return game(main,bar,side,right);
  if(lobby)return lob(main,bar);
  home(main,bar);
}
function sheetHTML(){return `<div class="sheet"><h3>${sheet.title}</h3>
  <div class="cap">${sheet.sub||""}</div><p>${sheet.body}</p>
  <button style="width:100%" onclick="window.__close()">Close</button></div>`}
window.__close=()=>{sheet=null;S.tap();paint()};

function home(main,bar){
  $("brand").textContent="GOD";
  main.append(el("h1","title","Gambit of Deccan"),
    el("p","sub","Two armies form on one piece of ground. The losers get the better cards."));
  main.append(el("div","rule"));
  main.append(el("div","cap","Your name"));
  const nm=el("input");nm.maxLength=16;nm.placeholder="Player";main.append(nm);
  main.append(el("div","cap","The table"));
  const c=el("button","go","Open a table");
  const jc=el("input");jc.maxLength=4;jc.placeholder="CODE";jc.style.textTransform="uppercase";
  const j=el("button","","Join");const r=el("div","grid2");r.append(jc,j);
  main.append(c,r);
  c.onclick=()=>send({t:"create",name:nm.value||"Player"});
  j.onclick=()=>send({t:"join",code:jc.value.toUpperCase(),name:nm.value||"Player"});
}

function lob(main,bar){
  $("brand").textContent=`TABLE ${lobby.code}`;
  const mine=lobby.seats[me.seat];
  main.append(el("div","cap",`Seated — ${lobby.seats.length} of 8`));
  for(const s of lobby.seats){const c=el("div","panel who");c.style.setProperty("--h",HUES[s.i%8]);
    c.append(el("span","hue"),
      el("span","",`<span class="nm">${s.i===me.seat?"▸ ":""}${s.name}</span>`+
        `<span class="rl">${s.bot?"bot · ":""}${s.ruler??"choosing"}</span>`),
      el("span",""," "));main.append(c)}
  main.append(el("div","rule"),el("div","cap","Choose your ruler"));
  const g=el("div","grid2");
  for(const r of lobby.rulers){const on=mine&&mine.faction===r.key;
    const b=el("button","cell"+(on?" on go":""),`${r.name}<span class="era">${r.era}</span>`);
    b.disabled=r.taken&&!on;b.onclick=()=>send({t:"pick",faction:r.key});g.append(b)}
  main.append(g);
  if(me.seat===0){const a=el("button","","Add bot"),s=el("button","go","Begin");
    s.disabled=lobby.seats.length<2||!(mine&&mine.faction);
    a.onclick=()=>send({t:"addBot"});s.onclick=()=>send({t:"start"});bar.append(a,s)}
  else bar.append(el("div","cap center","waiting for the host"));
}

function game(main,bar,side,right){
  const showAll=v.phase==="resolved"||v.phase==="over";
  const rev=v.reveal;
  const board=showAll&&rev&&rev.board?rev.board:v.armies.map(a=>a.units);
  const allKills=(rev&&rev.kills)||[];
  // a unit is struck only once ITS kill has fired, so the reveal reads one cause at a time
  const struck=new Set(allKills.slice(0,killStep).map(k=>`${k.hit.army}:${k.hit.slot}`));
  const isDead=(ai,ui)=>showAll&&struck.has(`${ai}:${ui}`);
  const justDied=(ai,ui)=>{const k=allKills[killStep-1];
    return !!k&&k.hit.army===ai&&k.hit.slot===ui};
  const justKilled=(ai,ui)=>{const k=allKills[killStep-1];
    return !!k&&k.by.army===ai&&k.by.slot===ui};
  $("brand").textContent=`ROUND ${v.round+1}`;
  const st=$("status");
  st.textContent=v.end?`the game is over — ${v.end}`:v.phase==="offer"?"an offer stands"
    :v.toAct===v.you?"your turn":`${v.players[v.toAct]?.name??""} deliberates`;
  st.className="st"+(v.toAct===v.you?" you":"");

  // ---- the read
  side.append(el("div","cap","The table"));
  for(const p of v.players){
    const s2=v.stats[p.seat];
    const c=el("div","panel who"+(v.toAct===p.seat?" act":"")+(p.sittingOut?" out":""));
    c.style.setProperty("--h",HUES[p.seat%8]);
    c.append(el("span","hue"),
      el("span","",`<span class="nm">${p.seat===v.you?"You":p.name}</span>`+
        `<span class="rl">${p.ruler}</span>`),
      el("span","vp num",`${p.vp}`));
    c.append(el("div","stats",
      `<span>sent <b class="num">${s2.commits}</b></span>`+
      `<span>str/rd <b class="num ${s2.aggression>=12?"hot":""}">${s2.aggression}</b></span>`+
      `<span>sat <b class="num">${s2.sitOuts}</b></span>`+
      `<span>refused <b class="num">${s2.offersRefused}</b></span>`+
      `<span>burnt <b class="num">${s2.burned}</b></span>`+
      (p.army!=null?`<span class="cap">Army ${p.army?"II":"I"}</span>`:"")));
    side.append(c);
  }
  side.append(el("div","rule"),el("div","cap",`Points — first to ${v.target}`));
  const sc=el("div","panel score");
  sc.append(el("div","h","ruler"),el("div","h","pts"),el("div","h","needs"));
  for(const p of [...v.players].sort((a,b)=>b.vp-a.vp))
    sc.append(el("div",p.seat===v.you?"me":"",p.seat===v.you?"You":p.name),
      el("div","num",`${p.vp}`),el("div","num",`${Math.max(0,v.target-p.vp)}`));
  side.append(sc);

  // ---- the ground
  const selU=sel?v.hand.find(u=>u.uid===sel):null;
  const army=(ai)=>{
    const a=v.armies[ai],wrap=el("div","panel armywrap");
    const head=el("div","armyhead");
    // contribution is how the ground pays, so it is printed, not implied
    const mem=(a.contrib||[]).map(c=>
      `<span class="${c.owner===v.you?"cmine":""}">${c.owner===v.you?"you":in2(v.players[c.owner].name)} ${c.units}</span>`
    ).join(" · ");
    head.append(el("span","",`<span class="ttl">Army ${ai?"II":"I"}</span>`+
      (mem?` <span class="mem">${mem}</span>`:"")));
    const won=showAll&&stage>=2&&rev&&!roll&&rev.winners.includes(ai);
    head.append(el("span","tot num"+(won?" win":""),
      showAll&&stage>=2&&rev?`${(roll?roll[ai]:rev.totals[ai])??0}`:`${a.count}/3`));
    const sl=el("div","slots");
    for(let i=0;i<3;i++){
      const u=board[ai]&&board[ai][i];
      if(!u){sl.append(el("div","slot empty"));continue}
      const open=showAll||u.arm!=null,dead=isDead(ai,i);
      const s2=el("div","slot"+(open?"":" hid")+(u.owner===v.you?" mine":"")+(dead?" dead":"")+
        (stage===0?" land":justDied(ai,i)?" shake":justKilled(ai,i)?" strike":""));
      if(justDied(ai,i))s2.style.setProperty("--mag",shakeMag);
      s2.style.setProperty("--h",HUES[u.owner%8]);
      s2.append(el("span","hue"));
      if(open){
        s2.insertAdjacentHTML("beforeend",svg(u.arm,54));
        s2.append(el("span","s num",`${u.s}`));
        if(u.broker)s2.append(el("span","brk"));
        s2.onclick=()=>{S.tap();sheet={title:`${SHORT[u.arm]} ${u.s}`,
          sub:`${v.players[u.owner].name}${u.broker?" · Power Broker":""}`,
          body:`Cancels ${RING.filter((_,j)=>beats(RING.indexOf(u.arm),j)).map(x=>SHORT[x]).join(" and ")}. `+
            `Cancelled by ${RING.filter((_,j)=>beats(j,RING.indexOf(u.arm))).map(x=>SHORT[x]).join(" and ")}.`};paint()};
      }else s2.append(el("span","lbl-fd","face down"));
      if(u.claim)s2.append(el("span","claimlab",`"${SHORT[u.claim]}"`));
      s2.append(el("span","init",in2(v.players[u.owner].name)));
      if(dead)s2.insertAdjacentHTML("beforeend",
        `<svg class="x" viewBox="0 0 100 140"><line x1="16" y1="20" x2="84" y2="120"/></svg>`);
      sl.append(s2);
    }
    wrap.append(head,sl);
    // ---- the commitment preview: exactly what sending this unit here would do.
    // Every number here is public. Nothing about the enemy's cards is revealed — only what the
    // player is entitled to know and previously had to work out in their head.
    if(selU&&v.toAct===v.you){
      const legal=v.actions.find(x=>x.type==="commit"&&x.uid===selU.uid&&x.army===ai);
      if(legal){
        const mineNow=((a.contrib||[]).find(c=>c.owner===v.you)||{units:0}).units;
        const others=(a.contrib||[]).filter(c=>c.owner!==v.you).map(c=>c.units);
        const best=others.length?Math.max(...others):0;
        const after=mineNow+1;
        const verdict=after>best?"you would be the largest contributor"
          :after===best?"you would tie for largest — you both score"
          :"you would not be the largest contributor";
        const bits=[`${after} of ${a.count+1} units yours`,verdict];
        if(a.count+1>=3)bits.push("this closes the army");
        if(legal.offer)bits.push("answered blind by "+v.players[a.leader].name);
        wrap.append(el("div","preview",bits.join(" — ")));
      }else if(a.full)wrap.append(el("div","preview dim2","full"));
    }
    return wrap;
  };
  const mid=el("div","clash");mid.append(ring(selU),note(selU));
  main.append(army(0),mid,army(1));
  if(callout)main.append(el("div","callout",callout));

  if(showAll&&stage>=2&&rev){
    if(rev.rocketsFired)main.append(el("div","panel center","<span class='cap' style='color:var(--verm)'>Sultan Rockets — the victors recover nothing</span>"));
    for(const [p,n2] of rev.awarded)
      main.append(el("div","center",`<span class="cap" style="color:var(--gold-hi)">${
        p===v.you?"You were":v.players[p].name+" was"} the largest contributor — +${n2}</span>`));
  }

  // ---- log
  right.append(el("div","cap","What happened"));
  const lg=el("div","panel log");
  for(const e of v.log)lg.append(el("div",e.kind,e.text));
  right.append(lg);

  // ---- hand
  $("handband").hidden=false;
  $("handlbl").textContent=`${v.players[v.you].ruler} — ${v.hand.filter(u=>u.state==="ready").length} ready`;
  const hand=$("hand");hand.innerHTML="";
  for(const u of v.hand){
    const cls=u.state==="burned"?"burn":u.state==="ready"?"":"rest";
    const c=el("div",`pc ${cls}${sel===u.uid?" sel":""}`);
    c.insertAdjacentHTML("beforeend",svg(u.arm,40));
    c.append(el("span","s num",`${u.s}`));
    c.append(el("div","nmm",u.broker?u.name:SHORT[u.arm]));
    if(u.state!=="ready")c.append(el("div","rst",
      u.state==="burned"?"burnt":u.state==="committed"?"on the ground":`returns r${u.returns+1}`));
    if(u.broker)c.append(el("span","brk"));
    c.onclick=()=>{S.tap();
      if(u.state!=="ready"){sheet={title:`${SHORT[u.arm]} ${u.s}`,sub:u.state,
        body:u.state==="burned"?"Lost with a defeated army. Gone for the rest of the game."
          :u.state==="committed"?"On the ground this round."
          :`It won its ground and is recovering. Returns in round ${u.returns+1}.`};paint();return}
      sel=sel===u.uid?null:u.uid;paint()};
    hand.append(c);
  }


  // ---- declarations. A claim about a face-down unit, and it may be a lie. Words, not cards:
  // the old client learned that offering a second row of CARDS read as playing another one.
  const myOnBoard=v.armies.flatMap(a=>a.units.filter(u=>u.owner===v.you));
  const lastMine=myOnBoard[myOnBoard.length-1];
  if(lastMine&&(v.phase==="muster"||v.phase==="offer")){
    const row=el("div","decl");
    row.append(el("span","cap","Say what it was"));
    for(const arm of RING){
      const b=el("button",lastMine.claim===arm?"on":"",SHORT[arm]);
      b.onclick=()=>send({t:"declare",arm});
      row.append(b);
    }
    const none=el("button",lastMine.claim?"":"on","Say nothing");
    none.onclick=()=>send({t:"declare",arm:null});
    row.append(none);
    $("handband").after(row);
    declRow=row;
  }

  // ---- actions
  if(v.phase==="offer"&&v.actions.some(a=>a.type==="accept")){
    main.append(el("div","panel center",
      `<span class="cap">${v.players[v.offer.from].name} sends a unit into your army</span>`+
      `<div style="color:var(--ivory-dim);font-size:13px;margin-top:4px">You cannot see what it is. They score from this army too.</div>`));
    const a=el("button","go","Accept"),r=el("button","no","Refuse");
    a.onclick=()=>send({t:"act",action:{type:"accept"}});
    r.onclick=()=>send({t:"act",action:{type:"refuse"}});bar.append(a,r);
  }else if(v.end&&v.phase==="over"){
    bar.append(el("div","cap center",v.winners.includes(v.you)?"You take the Deccan"
      :`${v.winners.map(s2=>v.players[s2].name).join(", ")} takes the Deccan`));
  }else if(v.toAct===v.you){
    const can=(n2)=>sel&&v.actions.some(a=>a.type==="commit"&&a.uid===sel&&a.army===n2);
    const isOf=(n2)=>sel&&v.actions.some(a=>a.type==="commit"&&a.uid===sel&&a.army===n2&&a.offer);
    const b0=el("button","go",isOf(0)?"Offer to I":"Send to I");
    const b1=el("button","go",isOf(1)?"Offer to II":"Send to II");
    const ps=el("button","","Hold");
    b0.disabled=!can(0);b1.disabled=!can(1);
    b0.onclick=()=>{send({t:"act",action:{type:"commit",uid:sel,army:0}});sel=null};
    b1.onclick=()=>{send({t:"act",action:{type:"commit",uid:sel,army:1}});sel=null};
    ps.onclick=()=>send({t:"act",action:{type:"pass"}});
    bar.append(b0,b1,ps);
  }else bar.append(el("div","cap center",showAll?"the ring resolves":"waiting"));
}

function ringSVG(mi){
  const R=34,cx=46,cy=44;
  const p=RING.map((_,i)=>{const t=-Math.PI/2+i*(2*Math.PI/5);
    return [cx+R*Math.cos(t),cy+R*Math.sin(t)]});
  let s=`<svg width="92" height="88" viewBox="0 0 92 88" role="img" aria-label="the ring of five arms">`;
  for(let i=0;i<5;i++){const j=(i+1)%5;
    s+=`<line class="edge" x1="${p[i][0]}" y1="${p[i][1]}" x2="${p[j][0]}" y2="${p[j][1]}"/>`}
  for(let i=0;i<5;i++){let c="node";
    if(mi>=0){if(i===mi)c+=" me";else if(beats(mi,i))c+=" kil";else if(beats(i,mi))c+=" thr"}
    s+=`<circle class="${c}" cx="${p[i][0]}" cy="${p[i][1]}" r="10"/>`;
    s+=`<text class="nlbl${mi===i?" on":""}" x="${p[i][0]}" y="${p[i][1]+3}">${RING[i][0]}</text>`}
  return s+"</svg>";
}
function ring(u){return el("div","",ringSVG(u?RING.indexOf(u.arm):-1))}
function note(u){
  if(!u)return el("div","ringnote","<b>The ring</b><br>each arm cancels<br>the next two");
  const i=RING.indexOf(u.arm);
  return el("div","ringnote",`<b>${SHORT[u.arm]} ${u.s}</b><br>`+
    `<span class="k">cancels ${RING.filter((_,j)=>beats(i,j)).map(a=>SHORT[a]).join(", ")}</span><br>`+
    `<span class="t">falls to ${RING.filter((_,j)=>beats(j,i)).map(a=>SHORT[a]).join(", ")}</span>`);
}
connect();paint();
</script>
