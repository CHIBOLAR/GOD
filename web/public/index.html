<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GOD — Gambit of Deccan</title>
<style>
  :root { --ink:#0c0d0e; --line:#3a3d40; --txt:#e8e6e1; --dim:#8b8f92; --act:#c9a227; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ink); color:var(--txt);
         font:14px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
         min-height:100svh; display:flex; flex-direction:column; }
  header { padding:10px 12px; border-bottom:1px solid var(--line); display:flex;
           justify-content:space-between; letter-spacing:.14em; font-size:12px; }
  main { flex:1; padding:12px; max-width:520px; width:100%; margin:0 auto; }
  h2 { font-size:12px; letter-spacing:.14em; color:var(--dim); font-weight:400;
       margin:18px 0 8px; text-transform:uppercase; }
  button { font:inherit; color:var(--txt); background:transparent; border:1px solid var(--line);
           padding:10px 12px; min-height:48px; cursor:pointer; }
  button:disabled { color:#4a4d50; border-color:#232527; cursor:default; }
  button.go { border-color:var(--act); color:var(--act); }
  input { font:inherit; color:var(--txt); background:transparent; border:1px solid var(--line);
          padding:10px; min-height:48px; width:100%; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row > * { flex:1 1 auto; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .cell { border:1px solid var(--line); padding:8px; }
  .cell.on { border-color:var(--act); }
  .slots { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:6px 0; }
  .slot { border:1px solid var(--line); min-height:104px; padding:6px; display:flex;
          flex-direction:column; justify-content:space-between; }
  .slot.empty { color:#4a4d50; align-items:center; justify-content:center; }
  .hand { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px;
          scroll-snap-type:x proximity; touch-action:pan-x; overscroll-behavior:contain; }
  .pc { flex:0 0 64px; border:1px solid var(--line); padding:6px 4px; text-align:center;
        scroll-snap-align:start; min-height:96px; }
  .pc.sel { border-color:var(--act); }
  .pc.out { border-style:dashed; color:var(--dim); }
  .pc.burn { border-style:dotted; color:#4a4d50; }
  .bar { position:sticky; bottom:0; background:var(--ink); border-top:1px solid var(--line);
         padding:8px 12px calc(8px + env(safe-area-inset-bottom));
         display:flex; gap:8px; }
  .bar button { flex:1; }
  .dim { color:var(--dim); }
  .err { color:#d2705a; }
  pre { white-space:pre-wrap; word-break:break-word; font-size:11px; color:var(--dim); }
</style>

<header><span>GOD · GAMBIT OF DECCAN</span><span id="conn" class="dim">connecting</span></header>
<main id="app"></main>
<div class="bar" id="bar"></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const app = $("app"), bar = $("bar");
let ws, me = { id: localStorage.getItem("god.id"), seat: -1, code: null };
let lobby = null, gv = null, sel = null, err = "";

function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host);
  ws.onopen  = () => { $("conn").textContent = "online";
    if (me.id && me.code) send({ t: "join", code: me.code, id: me.id }); render(); };
  ws.onclose = () => { $("conn").textContent = "offline"; setTimeout(connect, 1500); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === "seated")  { me.seat = m.seat; me.code = m.code; me.id = m.id;
                             localStorage.setItem("god.id", m.id); localStorage.setItem("god.code", m.code); }
    if (m.t === "lobby")   { lobby = m; gv = null; }
    if (m.t === "view")    { gv = m.view; }
    if (m.t === "error")   { err = m.msg; setTimeout(() => { err = ""; render(); }, 2500); }
    render();
  };
}
const send = (m) => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));
me.code = me.code || localStorage.getItem("god.code");

// ---- pieces: silhouette per arm, size by strength --------------------------
const ARM = { ELEPHANT:"E", RIFLEMAN:"R", CANNON:"C", HORSEMAN:"H", WARRIOR:"W" };
function piece(u) {
  if (!u || !u.arm) return `<div class="dim">?? ${u && u.owner != null ? "" : ""}</div>`;
  return `<div style="font-size:${12 + u.s}px">${ARM[u.arm]}${u.s}</div>`;
}

// ---- render ----------------------------------------------------------------
function render() {
  if (err) { app.innerHTML = `<p class="err">${err}</p>` + app.innerHTML; }
  if (gv) return renderGame();
  if (lobby) return renderLobby();
  renderHome();
}

function renderHome() {
  app.innerHTML = `
    <h2>Your name</h2><input id="nm" maxlength="16" placeholder="Player">
    <h2>Table</h2>
    <div class="row"><button class="go" id="create">Open a table</button></div>
    <div class="row" style="margin-top:8px">
      <input id="jc" maxlength="4" placeholder="CODE" style="flex:1 1 40%">
      <button id="join">Join</button>
    </div>`;
  bar.innerHTML = "";
  $("create").onclick = () => send({ t: "create", name: $("nm").value || "Player" });
  $("join").onclick   = () => send({ t: "join", code: $("jc").value.toUpperCase(), name: $("nm").value || "Player" });
}

function renderLobby() {
  const host = me.seat === 0, mine = lobby.seats[me.seat];
  app.innerHTML = `
    <h2>Table ${lobby.code} · ${lobby.seats.length}/8</h2>
    ${lobby.seats.map((s) => `<div class="cell">${s.i === me.seat ? "▸ " : ""}${s.name}${s.bot ? " · bot" : ""}
      <span class="dim">${s.ruler ?? "choosing"}</span></div>`).join("")}
    <h2>Choose your ruler</h2>
    <div class="grid">${lobby.rulers.map((r) => `
      <button class="cell ${mine && mine.faction === r.key ? "on" : ""}" data-k="${r.key}"
        ${r.taken && !(mine && mine.faction === r.key) ? "disabled" : ""}>
        ${r.name}<br><span class="dim" style="font-size:11px">${r.era}</span></button>`).join("")}</div>`;
  bar.innerHTML = host
    ? `<button id="bot">Add bot</button><button class="go" id="go">Start</button>`
    : `<span class="dim">waiting for the host</span>`;
  for (const b of app.querySelectorAll("[data-k]")) b.onclick = () => send({ t: "pick", faction: b.dataset.k });
  if (host) { $("bot").onclick = () => send({ t: "addBot" }); $("go").onclick = () => send({ t: "start" }); }
}

function renderGame() {
  const v = gv, mine = v.you;
  const army = (a) => `
    <h2>Army ${a.index === 0 ? "I" : "II"} · ${a.count} unit${a.count === 1 ? "" : "s"}
      ${a.total != null ? "· " + a.total : ""}</h2>
    <div class="slots">${[0,1,2].map((i) => {
      const u = a.units[i];
      if (!u) return `<div class="slot empty">·</div>`;
      const who = v.players[u.owner];
      return `<div class="slot"><div>${u.arm ? piece(u) : '<span class="dim">▨ hidden</span>'}</div>
        <div class="dim" style="font-size:11px">${who.name.slice(0,2).toUpperCase()}${u.revealed ? " ·up" : ""}</div></div>`;
    }).join("")}</div>`;

  app.innerHTML = `
    <div class="row"><span>ROUND ${v.round + 1}</span>
      <span class="dim">${v.phase}${v.toAct != null ? " · " + v.players[v.toAct].name : ""}</span>
      <span>${v.players[mine].vp}/${v.target}</span></div>
    <div class="row" style="margin-top:8px">${v.players.map((p) => `
      <span class="cell" style="flex:0 0 auto;font-size:12px">${p.name} ${p.vp}${p.army != null ? " ·" + (p.army ? "II" : "I") : ""}${p.sittingOut ? " ·out" : ""}</span>`).join("")}</div>
    ${army(v.armies[0])}
    <div class="dim" style="text-align:center;margin:8px 0">E — R — C — H — W · each kills the next two</div>
    ${army(v.armies[1])}
    ${v.reveal ? `<h2>Reveal</h2><pre>${JSON.stringify(v.reveal, null, 1)}</pre>` : ""}
    <h2>Your hand — ${v.players[mine].ruler}</h2>
    <div class="hand">${v.hand.map((u) => `
      <div class="pc ${sel === u.uid ? "sel" : ""} ${u.state === "burned" ? "burn" : u.state !== "ready" ? "out" : ""}"
           data-u="${u.uid}">${piece(u)}
        <div class="dim" style="font-size:10px">${u.broker ? u.name : u.state === "ready" ? "" : u.state}
        ${u.returns ? "r" + (u.returns + 1) : ""}</div></div>`).join("")}</div>`;

  for (const el of app.querySelectorAll("[data-u]")) el.onclick = () => {
    const u = v.hand.find((x) => x.uid === el.dataset.u);
    if (u.state === "ready") { sel = sel === u.uid ? null : u.uid; render(); }
  };

  const acts = v.actions.map((a) => a.type);
  if (v.phase === "offer" && acts.includes("accept")) {
    bar.innerHTML = `<button class="go" id="acc">Accept</button><button id="ref">Refuse</button>`;
    $("acc").onclick = () => send({ t: "act", action: { type: "accept" } });
    $("ref").onclick = () => send({ t: "act", action: { type: "refuse" } });
  } else if (v.toAct === mine) {
    const can = (n) => sel && v.actions.some((a) => a.type === "commit" && a.uid === sel && a.army === n);
    bar.innerHTML = `<button class="go" id="a0" ${can(0) ? "" : "disabled"}>Send I</button>
                     <button class="go" id="a1" ${can(1) ? "" : "disabled"}>Send II</button>
                     <button id="ps">Pass</button>`;
    $("a0").onclick = () => { send({ t: "act", action: { type: "commit", uid: sel, army: 0 } }); sel = null; };
    $("a1").onclick = () => { send({ t: "act", action: { type: "commit", uid: sel, army: 1 } }); sel = null; };
    $("ps").onclick = () => send({ t: "act", action: { type: "pass" } });
  } else {
    bar.innerHTML = `<span class="dim">${v.end ? "game over · " + v.end : "waiting…"}</span>`;
  }
}

connect(); render();
</script>
